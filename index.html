<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0f14">
  <title>MC Picking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0f14;
      --surface: #161a23;
      --surface2:#1e2330;
      --border:  #2a3045;
      --accent:  #3b82f6;
      --success: #22c55e;
      --warn:    #f59e0b;
      --danger:  #ef4444;
      --txt:     #e8eaf0;
      --txt2:    #8b92a8;
      --txt3:    #4a5166;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      overflow: hidden;
    }

    /* ── PANTALLAS ── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.2s;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(20px);
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .topbar-logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .topbar-logo svg { width: 16px; height: 16px; }
    .topbar-title { font-size: 15px; font-weight: 700; flex: 1; }
    .topbar-back {
      background: none; border: none; color: var(--accent);
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; padding: 4px 8px;
    }
    .topbar-sub { font-size: 11px; color: var(--txt3); }

    /* ── SCROLL CONTENT ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── PEDIDO CARD ── */
    .pedido-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pedido-card:active { border-color: var(--accent); }
    .pedido-card-icon {
      width: 40px; height: 40px;
      background: rgba(59,130,246,0.12);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px;
    }
    .pedido-card-info { flex: 1; min-width: 0; }
    .pedido-doc {
      font-size: 13px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent); margin-bottom: 2px;
    }
    .pedido-cliente {
      font-size: 13px; color: var(--txt);
      font-weight: 500; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .pedido-meta { font-size: 11px; color: var(--txt3); margin-top: 2px; }
    .pedido-arrow { color: var(--txt3); font-size: 18px; }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--txt3);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty .titulo { font-size: 16px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; }
    .empty .sub { font-size: 13px; line-height: 1.5; }

    /* ── LOADING ── */
    .loading {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 20px; gap: 10px; color: var(--txt3); font-size: 14px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PICKING SCREEN ── */
    .pedido-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .pedido-header-doc {
      font-size: 13px; font-weight: 700;
      color: var(--accent); font-family: 'JetBrains Mono', monospace;
    }
    .pedido-header-cli { font-size: 14px; font-weight: 600; color: var(--txt); }

    /* ── PROGRESO ── */
    .progreso-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .progreso-bar-bg {
      height: 6px; background: var(--border);
      border-radius: 10px; overflow: hidden; margin-bottom: 4px;
    }
    .progreso-bar-fill {
      height: 100%; border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), #6366f1);
      transition: width 0.4s ease;
    }
    .progreso-txt {
      font-size: 11px; color: var(--txt3); text-align: right;
    }

    /* ── SCANNER BOX ── */
    .scanner-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .scanner-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--txt3); margin-bottom: 10px;
    }
    .scanner-input-row {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .scanner-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 16px; /* evita zoom en iOS */
      color: var(--txt);
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }
    .scanner-input:focus { border-color: var(--accent); }
    .btn-camara {
      width: 48px; height: 48px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--txt2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.15s;
    }
    .btn-camara svg { width: 22px; height: 22px; }
    .btn-camara.activa { border-color: var(--success); color: var(--success); }

    /* ── CANTIDAD ── */
    .cantidad-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .cantidad-label { font-size: 12px; color: var(--txt2); }
    .cantidad-ctrl { display: flex; align-items: center; gap: 6px; }
    .cant-btn {
      width: 34px; height: 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--txt); font-size: 18px; font-weight: 700;
      cursor: pointer; font-family: inherit; line-height: 1;
    }
    .cant-input {
      width: 60px; height: 34px;
      text-align: center; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--txt); font-size: 16px; font-weight: 700;
      font-family: 'JetBrains Mono', monospace; outline: none;
    }

    /* ── BOTÓN VALIDAR ── */
    .btn-validar {
      width: 100%; padding: 14px;
      background: var(--accent); color: white;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .btn-validar:active { background: #2563eb; }
    .btn-validar:disabled { background: var(--border); color: var(--txt3); }

    /* ── FEEDBACK ── */
    .feedback {
      padding: 10px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      margin-bottom: 10px; display: none;
    }
    .feedback.ok    { display: block; background: rgba(34,197,94,0.12); color: #4ade80; }
    .feedback.error { display: block; background: rgba(239,68,68,0.12); color: #f87171; }
    .feedback.warn  { display: block; background: rgba(245,158,11,0.12); color: #fbbf24; }

    /* ── VISOR CÁMARA ── */
    .camara-wrap {
      display: none;
      margin-bottom: 10px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .camara-wrap.show { display: block; }
    #camara-container { width: 100%; }
    .camara-footer {
      display: flex; justify-content: space-between;
      align-items: center; padding: 8px 0;
    }
    .camara-hint { font-size: 11px; color: var(--txt3); }
    .btn-cerrar-cam {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; color: var(--txt2);
      padding: 4px 10px; font-size: 11px;
      cursor: pointer; font-family: inherit;
    }

    /* ── ITEMS ── */
    .items-label {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--txt3); margin-bottom: 8px;
    }
    .item-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 10px;
    }
    .item-row.ok { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.05); }
    .item-row.parcial { border-color: rgba(245,158,11,0.3); }
    .item-icon { font-size: 20px; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-desc {
      font-size: 13px; font-weight: 600; color: var(--txt);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-codigo { font-size: 11px; color: var(--txt3); font-family: 'JetBrains Mono', monospace; }
    .item-counter { text-align: right; flex-shrink: 0; }
    .item-n {
      font-size: 20px; font-weight: 800;
      font-family: 'JetBrains Mono', monospace; line-height: 1;
    }
    .item-n.ok  { color: #4ade80; }
    .item-n.mid { color: #fbbf24; }
    .item-n.no  { color: var(--txt3); }
    .item-d { font-size: 11px; color: var(--txt3); }

    /* ── CIERRE ── */
    .cierre {
      display: none;
      background: linear-gradient(135deg, #161a23, #1e2330);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      margin-bottom: 14px;
    }
    .cierre.show { display: block; }
    .cierre .emoji { font-size: 48px; margin-bottom: 10px; }
    .cierre h3 { font-size: 18px; font-weight: 800; color: #4ade80; margin-bottom: 6px; }
    .cierre p { font-size: 13px; color: var(--txt2); margin-bottom: 16px; }
    .btn-nuevo {
      padding: 12px 28px;
      background: var(--success); color: white;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }

    /* ── REFRESH BTN ── */
    .btn-refresh {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; width: 36px; height: 36px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer; color: var(--txt2);
    }
    .btn-refresh svg { width: 16px; height: 16px; }
  </style>
</head>
<body>

<!-- ── PANTALLA 1: LISTA DE PEDIDOS ── -->
<div class="screen" id="screen-pedidos">
  <div class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div>
      <div class="topbar-title">MC Picking</div>
      <div class="topbar-sub">Pedidos pendientes</div>
    </div>
    <button class="btn-refresh" id="btn-refresh" title="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.95"/>
      </svg>
    </button>
  </div>
  <div class="content" id="lista-pedidos">
    <div class="loading"><div class="spinner"></div>Cargando pedidos...</div>
  </div>
</div>

<!-- ── PANTALLA 2: PICKING ── -->
<div class="screen hidden" id="screen-picking">

  <div class="topbar">
    <button class="topbar-back" id="btn-volver">← Volver</button>
    <div>
      <div class="topbar-title" id="pick-doc">—</div>
      <div class="topbar-sub" id="pick-cli">—</div>
    </div>
  </div>

  <div class="progreso-wrap">
    <div class="progreso-bar-bg">
      <div class="progreso-bar-fill" id="prog-fill" style="width:0%"></div>
    </div>
    <div class="progreso-txt" id="prog-txt">0 de 0 ítems (0%)</div>
  </div>

  <div class="content">

    <!-- Cierre exitoso -->
    <div class="cierre" id="cierre">
      <div class="emoji">🎉</div>
      <h3>¡Picking completo!</h3>
      <p>Todos los ítems fueron validados.</p>
      <button class="btn-nuevo" id="btn-nuevo-picking">Nuevo picking</button>
    </div>

    <!-- Scanner -->
    <div class="scanner-box" id="scanner-box">
      <div class="scanner-label">Código de barras</div>

      <div class="scanner-input-row">
        <input class="scanner-input" id="input-codigo" type="text"
          inputmode="text" placeholder="Escanea o escribe..."
          autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false">
        <button class="btn-camara" id="btn-camara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
      </div>

      <!-- Visor cámara -->
      <div class="camara-wrap" id="camara-wrap">
        <div id="camara-container"></div>
        <div class="camara-footer">
          <span class="camara-hint">📷 Apunta al código</span>
          <button class="btn-cerrar-cam" id="btn-cerrar-cam">Cerrar</button>
        </div>
      </div>

      <!-- Cantidad -->
      <div class="cantidad-row">
        <span class="cantidad-label">Cantidad:</span>
        <div class="cantidad-ctrl">
          <button class="cant-btn" id="cant-menos">−</button>
          <input class="cant-input" id="input-cantidad" type="number" value="1" min="1" max="9999">
          <button class="cant-btn" id="cant-mas">+</button>
        </div>
      </div>

      <div class="feedback" id="feedback"></div>

      <button class="btn-validar" id="btn-validar">Validar</button>
    </div>

    <!-- Lista de ítems -->
    <div class="items-label">Ítems del pedido</div>
    <div id="lista-items">
      <div class="loading"><div class="spinner"></div>Cargando...</div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIGURACIÓN — cambia esta URL por la de tu Web App
// ═══════════════════════════════════════════════════════════
var API_URL = 'https://script.google.com/a/macros/importadoramc.cl/s/AKfycbycAyw8hofk21krVQUqvUiaVIQshDs-exVjj8NrDh1JRE26CiP6p-3Zp91l7Kz4l5Na6w/exec';

// ═══════════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ═══════════════════════════════════════════════════════════
var pedidoActual  = null;
var itemsActuales = [];
var html5QrCode   = null;
var camaraActiva  = false;

// ═══════════════════════════════════════════════════════════
//  API HELPER
// ═══════════════════════════════════════════════════════════
function api(params) {
  var qs = Object.keys(params).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetch(API_URL + '?' + qs, { redirect: 'follow' })
    .then(function(r) { return r.json(); });
}

// ═══════════════════════════════════════════════════════════
//  PANTALLAS
// ═══════════════════════════════════════════════════════════
function mostrarPantalla(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA 1 — LISTA DE PEDIDOS
// ═══════════════════════════════════════════════════════════
function cargarPedidos() {
  var lista = document.getElementById('lista-pedidos');
  lista.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando pedidos...</div>';

  api({ action: 'pedidos' })
    .then(function(pedidos) {
      if (!pedidos || pedidos.length === 0) {
        lista.innerHTML = '<div class="empty"><div class="icon">📦</div><div class="titulo">Sin pedidos pendientes</div><div class="sub">Cuando lleguen pedidos de Bsale aparecerán aquí</div></div>';
        return;
      }
      lista.innerHTML = pedidos.map(function(p) {
        return '<div class="pedido-card" data-id="' + p.id + '" data-doc="' + p.documento + '" data-cli="' + p.cliente + '">' +
          '<div class="pedido-card-icon">📋</div>' +
          '<div class="pedido-card-info">' +
            '<div class="pedido-doc">' + p.documento + '</div>' +
            '<div class="pedido-cliente">' + p.cliente + '</div>' +
            '<div class="pedido-meta">' + (p.vendedor || '') + (p.sucursal ? ' · ' + p.sucursal : '') + '</div>' +
          '</div>' +
          '<div class="pedido-arrow">›</div>' +
        '</div>';
      }).join('');

      // Bind clicks
      lista.querySelectorAll('.pedido-card').forEach(function(card) {
        card.addEventListener('click', function() {
          abrirPicking(
            card.getAttribute('data-id'),
            card.getAttribute('data-doc'),
            card.getAttribute('data-cli')
          );
        });
      });
    })
    .catch(function(err) {
      lista.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div class="titulo">Error al cargar</div><div class="sub">' + err.message + '</div></div>';
    });
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA 2 — PICKING
// ═══════════════════════════════════════════════════════════
function abrirPicking(id, doc, cli) {
  pedidoActual = id;
  document.getElementById('pick-doc').textContent = doc;
  document.getElementById('pick-cli').textContent = cli;
  document.getElementById('input-codigo').value = '';
  document.getElementById('input-cantidad').value = 1;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('cierre').className = 'cierre';
  document.getElementById('scanner-box').style.display = 'block';
  mostrarPantalla('screen-picking');
  cargarItems(id);
  setTimeout(function() {
    document.getElementById('input-codigo').focus();
  }, 300);
}

function cargarItems(id) {
  var lista = document.getElementById('lista-items');
  lista.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';

  api({ action: 'detalle', id: id })
    .then(function(items) {
      itemsActuales = items || [];
      renderItems();
      actualizarProgreso();
    })
    .catch(function(err) {
      lista.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div class="titulo">Error</div><div class="sub">' + err.message + '</div></div>';
    });
}

function renderItems() {
  var lista = document.getElementById('lista-items');
  if (!itemsActuales.length) {
    lista.innerHTML = '<div class="empty"><div class="icon">📦</div><div class="titulo">Sin ítems</div><div class="sub">Este pedido no tiene ítems en DETALLE_PEDIDO</div></div>';
    return;
  }
  lista.innerHTML = itemsActuales.map(function(item) {
    var ok     = item.completado;
    var parc   = !ok && item.cantidadPicada > 0;
    var nClass = ok ? 'ok' : (parc ? 'mid' : 'no');
    var icon   = ok ? '✅' : (parc ? '⏳' : '○');
    var rowCls = ok ? 'item-row ok' : (parc ? 'item-row parcial' : 'item-row');
    return '<div class="' + rowCls + '">' +
      '<div class="item-icon">' + icon + '</div>' +
      '<div class="item-info">' +
        '<div class="item-desc">' + item.descripcion + '</div>' +
        '<div class="item-codigo">' + item.codigoBarras + '</div>' +
      '</div>' +
      '<div class="item-counter">' +
        '<div class="item-n ' + nClass + '">' + item.cantidadPicada + '</div>' +
        '<div class="item-d">/ ' + item.cantidad + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function actualizarProgreso() {
  var total    = itemsActuales.length;
  var completos = itemsActuales.filter(function(i) { return i.completado; }).length;
  var pct      = total > 0 ? Math.round(completos / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').textContent =
    completos + ' de ' + total + ' ítems (' + pct + '%)';
}

// ═══════════════════════════════════════════════════════════
//  VALIDAR CÓDIGO
// ═══════════════════════════════════════════════════════════
function validarCodigo() {
  var codigo  = document.getElementById('input-codigo').value.trim();
  if (!codigo) return;
  var cantidad = parseInt(document.getElementById('input-cantidad').value, 10) || 1;

  var btn = document.getElementById('btn-validar');
  btn.disabled = true;
  btn.textContent = 'Validando...';

  api({ action: 'picking', id: pedidoActual, codigo: codigo, cantidad: cantidad })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = 'Validar';
      mostrarFeedback(res);
      document.getElementById('input-codigo').value = '';
      document.getElementById('input-cantidad').value = 1;

      if (res.ok) {
        actualizarItemLocal(codigo, res.nuevaCantidad, res.cantidadPedido);
        renderItems();
        actualizarProgreso();
        if (res.pedidoCompleto) mostrarCierre();
        if (navigator.vibrate) navigator.vibrate([60]);
      } else {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      }
      document.getElementById('input-codigo').focus();
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Validar';
      mostrarFeedback({ ok: false, mensaje: 'Error de red: ' + err.message });
    });
}

function actualizarItemLocal(codigo, nuevaCantidad, total) {
  itemsActuales.forEach(function(item) {
    if (item.codigoBarras === String(codigo)) {
      item.cantidadPicada = nuevaCantidad;
      item.completado     = nuevaCantidad >= total;
    }
  });
}

function mostrarFeedback(res) {
  var fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = res.mensaje || '';
  if (res.ok) fb.classList.add('ok');
  else if (res.mensaje && res.mensaje.indexOf('⚠️') > -1) fb.classList.add('warn');
  else fb.classList.add('error');
  clearTimeout(fb._t);
  fb._t = setTimeout(function() { fb.className = 'feedback'; }, 3500);
}

function mostrarCierre() {
  document.getElementById('cierre').className = 'cierre show';
  document.getElementById('scanner-box').style.display = 'none';

  // Notificar a la ventana padre (app MC Logística) que el picking terminó
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(
      { tipo: 'picking_completo', idPedido: pedidoActual },
      '*'
    );
    // Cerrar esta pestaña después de 3 segundos
    setTimeout(function() {
      window.close();
    }, 3000);
  }
}

// ═══════════════════════════════════════════════════════════
//  CÁMARA con html5-qrcode
// ═══════════════════════════════════════════════════════════
function abrirCamara() {
  if (camaraActiva) { cerrarCamara(); return; }

  if (typeof Html5Qrcode === 'undefined') {
    mostrarFeedback({ ok: false, mensaje: '⚠️ Librería de cámara no disponible. Recarga la página.' });
    return;
  }

  var wrap   = document.getElementById('camara-wrap');
  var btnCam = document.getElementById('btn-camara');

  // Limpiar contenedor
  document.getElementById('camara-container').innerHTML = '';

  wrap.classList.add('show');
  btnCam.classList.add('activa');

  html5QrCode = new Html5Qrcode('camara-container');

  html5QrCode.start(
    { facingMode: 'environment' },
    {
      fps: 15,
      qrbox: { width: 250, height: 150 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.QR_CODE
      ]
    },
    function onSuccess(decoded) {
      document.getElementById('input-codigo').value = decoded;
      cerrarCamara();
      if (navigator.vibrate) navigator.vibrate([80]);
      setTimeout(validarCodigo, 150);
    },
    function onError() {}
  ).then(function() {
    camaraActiva = true;
  }).catch(function(err) {
    cerrarCamara();
    var msg = '⚠️ No se pudo acceder a la cámara.';
    var s = String(err).toLowerCase();
    if (s.indexOf('notallowed') > -1 || s.indexOf('denied') > -1) {
      msg = '📵 Permiso de cámara denegado. Toca el 🔒 en la barra de URL → Cámara → Permitir.';
    }
    mostrarFeedback({ ok: false, mensaje: msg });
  });
}

function cerrarCamara() {
  if (html5QrCode && camaraActiva) {
    html5QrCode.stop().catch(function() {}).finally(function() {
      html5QrCode = null;
    });
  }
  camaraActiva = false;
  document.getElementById('camara-wrap').classList.remove('show');
  document.getElementById('btn-camara').classList.remove('activa');
}

// ═══════════════════════════════════════════════════════════
//  BIND EVENTOS
// ═══════════════════════════════════════════════════════════
document.getElementById('btn-refresh').addEventListener('click', cargarPedidos);
document.getElementById('btn-volver').addEventListener('click', function() {
  cerrarCamara();
  mostrarPantalla('screen-pedidos');
  cargarPedidos();
});
document.getElementById('btn-camara').addEventListener('click', abrirCamara);
document.getElementById('btn-cerrar-cam').addEventListener('click', cerrarCamara);
document.getElementById('btn-validar').addEventListener('click', validarCodigo);
document.getElementById('btn-nuevo-picking').addEventListener('click', function() {
  mostrarPantalla('screen-pedidos');
  cargarPedidos();
});
document.getElementById('input-codigo').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') validarCodigo();
});
document.getElementById('cant-menos').addEventListener('click', function() {
  var i = document.getElementById('input-cantidad');
  i.value = Math.max(1, parseInt(i.value, 10) - 1);
});
document.getElementById('cant-mas').addEventListener('click', function() {
  var i = document.getElementById('input-cantidad');
  i.value = Math.min(9999, parseInt(i.value, 10) + 1);
});

// ═══════════════════════════════════════════════════════════
//  INICIO — leer parámetros de la URL
// ═══════════════════════════════════════════════════════════
(function() {
  var params = new URLSearchParams(window.location.search);
  var pedidoId  = params.get('pedido');
  var pedidoDoc = params.get('doc');

  if (pedidoId) {
    // Vino con pedido preseleccionado — ir directo al picking
    // Mostrar pantalla de picking inmediatamente
    mostrarPantalla('screen-picking');
    document.getElementById('pick-doc').textContent = pedidoDoc || pedidoId;
    document.getElementById('pick-cli').textContent = 'Cargando...';
    pedidoActual = pedidoId;

    // Cargar detalle del pedido
    api({ action: 'detalle', id: pedidoId })
      .then(function(items) {
        itemsActuales = items || [];
        renderItems();
        actualizarProgreso();
        // Actualizar cliente desde la lista
        api({ action: 'pedidos' }).then(function(pedidos) {
          var p = (pedidos || []).filter(function(x) { return x.id === pedidoId; })[0];
          if (p) document.getElementById('pick-cli').textContent = p.cliente;
        }).catch(function() {});
      })
      .catch(function(err) {
        document.getElementById('lista-items').innerHTML =
          '<div class="empty"><div class="icon">⚠️</div><div class="titulo">Error</div><div class="sub">' + err.message + '</div></div>';
      });
  } else {
    // Sin pedido — mostrar lista normal
    cargarPedidos();
  }
})();

cargarPedidos;
</script>
</body>
