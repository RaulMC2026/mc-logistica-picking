<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>MC Picking</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Respaldo para teléfonos sin BarcodeDetector nativo (ej. iOS Safari) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f6f7f9;
      --surface:   #ffffff;
      --surface2:  #f9fafb;
      --border:    #ececf0;
      --border2:   #e2e5ea;
      --accent:    #2563eb;
      --accent-soft:#eef3ff;
      --success:   #15a34a;
      --success-soft:#edf9f1;
      --warn:      #b45309;
      --warn-soft: #fdf6ec;
      --danger:    #dc2626;
      --danger-soft:#fdeeee;
      --txt:       #171a1f;
      --txt2:      #5c636e;
      --txt3:      #9aa0ab;
      --shadow:    0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
      --radius:    12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--txt);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 15px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── PANTALLAS ── */
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); transition: opacity 0.2s, transform 0.2s; }
    .screen.hidden { opacity: 0; pointer-events: none; transform: translateX(20px); }

    /* ── TOPBAR ── */
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 13px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .topbar-logo { height: 28px; width: auto; display: block; flex-shrink: 0; }
    .topbar-mid { flex: 1; min-width: 0; }
    .topbar-title { font-size: 15px; font-weight: 700; flex: 1; letter-spacing: -0.2px; }
    .topbar-back { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 4px 8px; }
    .topbar-sub { font-size: 11px; color: var(--txt3); margin-top: 1px; }

    /* ── SCROLL CONTENT ── */
    .content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

    /* ── PEDIDO CARD ── */
    .pedido-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
    .pedido-card:active { border-color: var(--accent); transform: scale(0.995); }
    .pedido-card-icon { width: 38px; height: 38px; background: var(--accent-soft); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; }
    .pedido-card-info { flex: 1; min-width: 0; }
    .pedido-doc { font-size: 13px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; color: var(--accent); margin-bottom: 2px; }
    .pedido-cliente { font-size: 13px; color: var(--txt); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pedido-meta { font-size: 11px; color: var(--txt3); margin-top: 2px; }
    .pedido-arrow { color: var(--txt3); font-size: 18px; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--txt3); }
    .empty .icon { font-size: 44px; margin-bottom: 12px; opacity: 0.7; }
    .empty .titulo { font-size: 16px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; }
    .empty .sub { font-size: 13px; line-height: 1.5; }

    /* ── LOADING ── */
    .loading { display: flex; align-items: center; justify-content: center; padding: 60px 20px; gap: 10px; color: var(--txt3); font-size: 14px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PROGRESO ── */
    .progreso-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; flex-shrink: 0; }
    .progreso-bar-bg { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 5px; }
    .progreso-bar-fill { height: 100%; border-radius: 10px; background: var(--accent); transition: width 0.4s ease; }
    .progreso-txt { font-size: 11px; color: var(--txt3); text-align: right; }

    /* ── SCANNER BOX ── */
    .scanner-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .scanner-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--txt3); margin-bottom: 10px; }
    .scanner-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .scanner-input { flex: 1; background: var(--surface); border: 1px solid var(--border2); border-radius: 9px; padding: 12px 14px; font-size: 16px; color: var(--txt); font-family: 'JetBrains Mono', ui-monospace, monospace; outline: none; transition: border-color 0.15s; }
    .scanner-input:focus { border-color: var(--accent); }
    .btn-camara { min-width: 48px; height: 48px; padding: 0 16px; background: var(--accent); border: none; border-radius: 9px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; flex-shrink: 0; font-family: inherit; font-weight: 600; font-size: 13px; transition: opacity 0.15s; }
    .btn-camara:active { opacity: 0.85; }
    .btn-camara svg { width: 20px; height: 20px; }

    /* ── CANTIDAD (manual / pistola) ── */
    .cantidad-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .cantidad-label { font-size: 12px; color: var(--txt2); }
    .cantidad-ctrl { display: flex; align-items: center; gap: 6px; }
    .cant-btn { width: 34px; height: 34px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; color: var(--txt2); font-size: 18px; font-weight: 600; cursor: pointer; font-family: inherit; line-height: 1; }
    .cant-btn:active { background: var(--surface2); }
    .cant-input { width: 58px; height: 34px; text-align: center; border-radius: 8px; background: var(--surface); border: 1px solid var(--border2); color: var(--txt); font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace; outline: none; }

    /* ── BOTÓN VALIDAR (secundario, minimalista) ── */
    .btn-validar { width: 100%; padding: 13px; background: var(--surface); color: var(--txt); border: 1px solid var(--border2); border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn-validar:active { background: var(--surface2); }
    .btn-validar:disabled { color: var(--txt3); background: var(--surface2); }

    /* ── FEEDBACK ── */
    .feedback { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 12px; display: none; }
    .feedback.ok    { display: block; background: var(--success-soft); color: var(--success); }
    .feedback.error { display: block; background: var(--danger-soft); color: var(--danger); }
    .feedback.warn  { display: block; background: var(--warn-soft); color: var(--warn); }

    /* ── ITEMS ── */
    .items-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--txt3); margin-bottom: 8px; }
    .item-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
    .item-row.ok { border-color: #cdeed8; background: var(--success-soft); }
    .item-row.parcial { border-color: #f3e2c2; }
    .item-icon { font-size: 19px; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-desc { font-size: 13px; font-weight: 600; color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-codigo { font-size: 11px; color: var(--txt3); font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .item-counter { text-align: right; flex-shrink: 0; }
    .item-n { font-size: 19px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; line-height: 1; }
    .item-n.ok  { color: var(--success); }
    .item-n.mid { color: var(--warn); }
    .item-n.no  { color: var(--txt3); }
    .item-d { font-size: 11px; color: var(--txt3); }

    /* ── CIERRE ── */
    .cierre { display: none; background: var(--surface); border: 1px solid #cdeed8; border-radius: 14px; padding: 28px 24px; text-align: center; margin-bottom: 14px; box-shadow: var(--shadow); }
    .cierre.show { display: block; }
    .cierre .emoji { font-size: 44px; margin-bottom: 12px; }
    .cierre h3 { font-size: 18px; font-weight: 800; color: var(--success); margin-bottom: 6px; letter-spacing: -0.2px; }
    .cierre p { font-size: 13px; color: var(--txt2); margin-bottom: 18px; }
    .btn-nuevo { padding: 12px 28px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }

    /* ── REFRESH BTN ── */
    .btn-refresh { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border2); border-radius: 9px; cursor: pointer; color: var(--txt2); }
    .btn-refresh:active { background: var(--surface2); }
    .btn-refresh svg { width: 16px; height: 16px; }

    /* ── OVERLAY CÁMARA (escáner en vivo) ── */
    .cam-overlay { position: fixed; inset: 0; z-index: 1000; background: var(--surface); display: none; flex-direction: column; }
    .cam-overlay.show { display: flex; }
    .cam-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--txt); flex-shrink: 0; position: relative; z-index: 2; }
    .cam-top .t { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
    .cam-top button { background: none; border: 1px solid var(--border2); color: var(--txt2); border-radius: 9px; padding: 7px 16px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .cam-view { position: relative; flex: 1; overflow: hidden; background: #0d0f14; }
    #cam-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #cam-lib { width: 100%; height: 100%; }
    .cam-marco { position: absolute; top: 44%; left: 50%; transform: translate(-50%,-50%); width: 80%; height: 26%; border: 3px solid rgba(255,255,255,.9); border-radius: 12px; box-shadow: 0 0 0 2000px rgba(0,0,0,.45); pointer-events: none; }
    .cam-hint { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; color: #fff; font-size: 14px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none; }
    .cam-toast { position: absolute; top: 20px; left: 16px; right: 16px; z-index: 3; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; text-align: center; display: none; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    .cam-toast.ok    { display: block; background: var(--success); color: #fff; }
    .cam-toast.error { display: block; background: var(--danger); color: #fff; }
    .cam-toast.warn  { display: block; background: var(--warn); color: #fff; }

    .cam-confirm { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom)); transform: translateY(115%); transition: transform .22s ease; box-shadow: 0 -8px 24px rgba(16,24,40,.08); }
    .cam-confirm.show { transform: translateY(0); }
    .cam-confirm .lbl { font-size: 12px; color: var(--success); font-weight: 700; text-align: center; }
    .cam-confirm .cod { font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 800; font-size: 26px; text-align: center; margin: 6px 0 18px; color: var(--txt); word-break: break-all; }
    .cam-cant-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
    .cam-cant-row .lab { font-size: 14px; color: var(--txt2); font-weight: 600; }
    .cam-cant-ctrl { display: flex; align-items: center; border: 1px solid var(--border2); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .cam-cant-ctrl button { width: 54px; height: 54px; border: none; background: var(--surface2); color: var(--accent); font-size: 26px; font-weight: 600; cursor: pointer; }
    .cam-cant-ctrl input { width: 72px; height: 54px; text-align: center; border: none; background: var(--surface); color: var(--txt); font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', ui-monospace, monospace; outline: none; border-left: 1px solid var(--border2); border-right: 1px solid var(--border2); }
    .cam-acc { display: flex; flex-direction: column; gap: 10px; }
    .cam-acc button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
    .cam-acc .conf { background: var(--accent); color: #fff; }
    .cam-acc .otro { background: var(--surface); color: var(--txt2); border: 1px solid var(--border2); }
  </style>
</head>
<body>

<!-- ── PANTALLA 1: LISTA DE PEDIDOS ── -->
<div class="screen" id="screen-pedidos">
  <div class="topbar">
    <img class="topbar-logo" src="logo-mc.png" alt="Importadora MC">
    <div class="topbar-mid">
      <div class="topbar-title">MC Picking</div>
      <div class="topbar-sub">Pedidos pendientes</div>
    </div>
    <button class="btn-refresh" id="btn-refresh" title="Actualizar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.95"/>
      </svg>
    </button>
  </div>
  <div class="content" id="lista-pedidos">
    <div class="loading"><div class="spinner"></div>Cargando pedidos...</div>
  </div>
</div>

<!-- ── PANTALLA 2: PICKING ── -->
<div class="screen hidden" id="screen-picking">

  <div class="topbar">
    <button class="topbar-back" id="btn-volver">← Volver</button>
    <div class="topbar-mid">
      <div class="topbar-title" id="pick-doc">—</div>
      <div class="topbar-sub" id="pick-cli">—</div>
    </div>
    <img class="topbar-logo" src="logo-mc.png" alt="Importadora MC">
  </div>

  <div class="progreso-wrap">
    <div class="progreso-bar-bg">
      <div class="progreso-bar-fill" id="prog-fill" style="width:0%"></div>
    </div>
    <div class="progreso-txt" id="prog-txt">0 de 0 ítems (0%)</div>
  </div>

  <div class="content">

    <!-- Cierre exitoso -->
    <div class="cierre" id="cierre">
      <div class="emoji">🎉</div>
      <h3>¡Picking completo!</h3>
      <p>Todos los ítems fueron validados.</p>
      <button class="btn-nuevo" id="btn-nuevo-picking">Nuevo picking</button>
    </div>

    <!-- Scanner -->
    <div class="scanner-box" id="scanner-box">
      <div class="scanner-label">Código de barras</div>

      <div class="scanner-input-row">
        <input class="scanner-input" id="input-codigo" type="text"
          inputmode="text" placeholder="Escanea o escribe..."
          autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false">
        <button class="btn-camara" id="btn-camara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Cámara
        </button>
      </div>

      <!-- Cantidad (modo manual / pistola Bluetooth) -->
      <div class="cantidad-row">
        <span class="cantidad-label">Cantidad:</span>
        <div class="cantidad-ctrl">
          <button class="cant-btn" id="cant-menos">−</button>
          <input class="cant-input" id="input-cantidad" type="number" value="1" min="1" max="9999">
          <button class="cant-btn" id="cant-mas">+</button>
        </div>
      </div>

      <div class="feedback" id="feedback"></div>

      <button class="btn-validar" id="btn-validar">Validar</button>
    </div>

    <!-- Lista de ítems -->
    <div class="items-label">Ítems del pedido</div>
    <div id="lista-items">
      <div class="loading"><div class="spinner"></div>Cargando...</div>
    </div>

  </div>
</div>

<!-- ── OVERLAY CÁMARA EN VIVO ── -->
<div class="cam-overlay" id="cam-overlay">
  <div class="cam-top">
    <span class="t">Escanear código</span>
    <button id="cam-cerrar">Cerrar</button>
  </div>
  <div class="cam-view">
    <video id="cam-video" playsinline muted></video>
    <div id="cam-lib" style="display:none"></div>
    <div class="cam-marco"></div>
    <div class="cam-hint" id="cam-hint">Apunta al código de barras</div>
    <div class="cam-toast" id="cam-toast"></div>

    <div class="cam-confirm" id="cam-confirm">
      <div class="lbl">Código leído</div>
      <div class="cod" id="cam-cod">—</div>
      <div class="cam-cant-row">
        <span class="lab">Cantidad</span>
        <div class="cam-cant-ctrl">
          <button id="cam-menos">−</button>
          <input id="cam-cant" type="number" value="1" min="1" inputmode="numeric">
          <button id="cam-mas">+</button>
        </div>
      </div>
      <div class="cam-acc">
        <button class="conf" id="cam-confirm-btn">Confirmar</button>
        <button class="otro" id="cam-otro">Escanear otro</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIGURACIÓN — URL de tu Web App (sin cambios)
// ═══════════════════════════════════════════════════════════
var API_URL = 'https://script.google.com/a/macros/importadoramc.cl/s/AKfycbycAyw8hofk21krVQUqvUiaVIQshDs-exVjj8NrDh1JRE26CiP6p-3Zp91l7Kz4l5Na6w/exec';

  var USUARIO =
  localStorage.getItem('usuarioPicking') || '';
// ═══════════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ═══════════════════════════════════════════════════════════
var pedidoActual  = null;
var itemsActuales = [];

// Cámara
var html5QrCode   = null;
var camStream     = null;
var camEscaneando = false;
var camDetector   = null;
var camModo       = null;   // 'nativo' | 'lib'
var camCodigo     = null;
var audioCtx      = null;
var FORMATOS = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar','qr_code'];

// ═══════════════════════════════════════════════════════════
//  API HELPER (sin cambios)
// ═══════════════════════════════════════════════════════════
function api(params) {

  params.usuario = USUARIO;
  
  var qs = Object.keys(params).map(function(k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');
  return fetch(API_URL + '?' + qs, { redirect: 'follow' })
    .then(function(r) { return r.json(); });
}

// ═══════════════════════════════════════════════════════════
//  PANTALLAS
// ═══════════════════════════════════════════════════════════
function mostrarPantalla(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.add('hidden'); });
  document.getElementById(id).classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA 1 — LISTA DE PEDIDOS
// ═══════════════════════════════════════════════════════════
function cargarPedidos() {
  var lista = document.getElementById('lista-pedidos');
  lista.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando pedidos...</div>';

  api({ action: 'pedidos' })
    .then(function(pedidos) {
      if (!pedidos || pedidos.length === 0) {
        lista.innerHTML = '<div class="empty"><div class="icon">📦</div><div class="titulo">Sin pedidos pendientes</div><div class="sub">Cuando lleguen pedidos de Bsale aparecerán aquí</div></div>';
        return;
      }
      lista.innerHTML = pedidos.map(function(p) {
        return '<div class="pedido-card" data-id="' + p.id + '" data-doc="' + p.documento + '" data-cli="' + p.cliente + '">' +
          '<div class="pedido-card-icon">📋</div>' +
          '<div class="pedido-card-info">' +
            '<div class="pedido-doc">' + p.documento + '</div>' +
            '<div class="pedido-cliente">' + p.cliente + '</div>' +
            '<div class="pedido-meta">' + (p.vendedor || '') + (p.sucursal ? ' · ' + p.sucursal : '') + '</div>' +
          '</div>' +
          '<div class="pedido-arrow">›</div>' +
        '</div>';
      }).join('');

      lista.querySelectorAll('.pedido-card').forEach(function(card) {
        card.addEventListener('click', function() {
          abrirPicking(card.getAttribute('data-id'), card.getAttribute('data-doc'), card.getAttribute('data-cli'));
        });
      });
    })
    .catch(function(err) {
      lista.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div class="titulo">Error al cargar</div><div class="sub">' + err.message + '</div></div>';
    });
}

// ═══════════════════════════════════════════════════════════
//  PANTALLA 2 — PICKING
// ═══════════════════════════════════════════════════════════
function abrirPicking(id, doc, cli) {
  pedidoActual = id;
  document.getElementById('pick-doc').textContent = doc;
  document.getElementById('pick-cli').textContent = cli;
  document.getElementById('input-codigo').value = '';
  document.getElementById('input-cantidad').value = 1;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('cierre').className = 'cierre';
  document.getElementById('scanner-box').style.display = 'block';
  mostrarPantalla('screen-picking');
  cargarItems(id);
  setTimeout(function() { document.getElementById('input-codigo').focus(); }, 300);
}

function cargarItems(id) {
  var lista = document.getElementById('lista-items');
  lista.innerHTML = '<div class="loading"><div class="spinner"></div>Cargando...</div>';

  api({ action: 'detalle', id: id })
    .then(function(items) {
      itemsActuales = items || [];
      renderItems();
      actualizarProgreso();
    })
    .catch(function(err) {
      lista.innerHTML = '<div class="empty"><div class="icon">⚠️</div><div class="titulo">Error</div><div class="sub">' + err.message + '</div></div>';
    });
}

function renderItems() {
  var lista = document.getElementById('lista-items');
  if (!itemsActuales.length) {
    lista.innerHTML = '<div class="empty"><div class="icon">📦</div><div class="titulo">Sin ítems</div><div class="sub">Este pedido no tiene ítems en DETALLE_PEDIDO</div></div>';
    return;
  }
  lista.innerHTML = itemsActuales.map(function(item) {
    var ok     = item.completado;
    var parc   = !ok && item.cantidadPicada > 0;
    var nClass = ok ? 'ok' : (parc ? 'mid' : 'no');
    var icon   = ok ? '✅' : (parc ? '⏳' : '○');
    var rowCls = ok ? 'item-row ok' : (parc ? 'item-row parcial' : 'item-row');
    return '<div class="' + rowCls + '">' +
      '<div class="item-icon">' + icon + '</div>' +
      '<div class="item-info">' +
        '<div class="item-desc">' + item.descripcion + '</div>' +
        '<div class="item-codigo">' + item.codigoBarras + '</div>' +
      '</div>' +
      '<div class="item-counter">' +
        '<div class="item-n ' + nClass + '">' + item.cantidadPicada + '</div>' +
        '<div class="item-d">/ ' + item.cantidad + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function actualizarProgreso() {
  var total     = itemsActuales.length;
  var completos = itemsActuales.filter(function(i) { return i.completado; }).length;
  var pct       = total > 0 ? Math.round(completos / total * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').textContent = completos + ' de ' + total + ' ítems (' + pct + '%)';
}

// ═══════════════════════════════════════════════════════════
//  VALIDAR CÓDIGO — acepta (codigo, cantidad) opcionales.
//  Sin argumentos = modo manual / pistola (lee los inputs).
// ═══════════════════════════════════════════════════════════
function validarCodigo(codigoArg, cantidadArg) {
  var codigo = (codigoArg != null ? String(codigoArg) : document.getElementById('input-codigo').value).trim();
  if (!codigo) return Promise.resolve(null);
  var cantidad = cantidadArg != null ? cantidadArg : (parseInt(document.getElementById('input-cantidad').value, 10) || 1);

  var btn = document.getElementById('btn-validar');
  btn.disabled = true;
  btn.textContent = 'Validando...';

  return api({ action: 'picking', id: pedidoActual, codigo: codigo, cantidad: cantidad })
    .then(function(res) {
      btn.disabled = false;
      btn.textContent = 'Validar';
      mostrarFeedback(res);
      document.getElementById('input-codigo').value = '';
      document.getElementById('input-cantidad').value = 1;

      if (res.ok) {
        actualizarItemLocal(codigo, res.nuevaCantidad, res.cantidadPedido);
        renderItems();
        actualizarProgreso();
        if (res.pedidoCompleto) mostrarCierre();
        if (navigator.vibrate) navigator.vibrate([60]);
      } else {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      }
      if (!camaraAbierta()) document.getElementById('input-codigo').focus();
      return res;
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Validar';
      var r = { ok: false, mensaje: 'Error de red: ' + err.message };
      mostrarFeedback(r);
      return r;
    });
}

function actualizarItemLocal(codigo, nuevaCantidad, total) {
  itemsActuales.forEach(function(item) {
    if (item.codigoBarras === String(codigo)) {
      item.cantidadPicada = nuevaCantidad;
      item.completado     = nuevaCantidad >= total;
    }
  });
}

function mostrarFeedback(res) {
  var fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.textContent = res && res.mensaje ? res.mensaje : '';
  if (res && res.ok) fb.classList.add('ok');
  else if (res && res.mensaje && res.mensaje.indexOf('⚠️') > -1) fb.classList.add('warn');
  else fb.classList.add('error');
  clearTimeout(fb._t);
  fb._t = setTimeout(function() { fb.className = 'feedback'; }, 3500);
}

function mostrarCierre() {
  document.getElementById('cierre').className = 'cierre show';
  document.getElementById('scanner-box').style.display = 'none';

  // Notificar a la ventana padre (app MC Logística) y cerrar pestaña → volver a packing
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({ tipo: 'picking_completo', idPedido: pedidoActual }, '*');
    setTimeout(function() { window.close(); }, 3000);
  }
}

// ═══════════════════════════════════════════════════════════
//  ESCÁNER EN VIVO  (BarcodeDetector nativo + respaldo html5-qrcode)
// ═══════════════════════════════════════════════════════════
function camaraAbierta() { return document.getElementById('cam-overlay').classList.contains('show'); }

function beep() {
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.12;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  } catch (e) {}
}

function abrirCamara() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  document.getElementById('cam-overlay').classList.add('show');
  document.getElementById('cam-confirm').classList.remove('show');
  ocultarToastCam();
  iniciarScanner();
}

function iniciarScanner() {
  if ('BarcodeDetector' in window) {
    BarcodeDetector.getSupportedFormats().then(function(sop) {
      var usar = FORMATOS.filter(function(x) { return sop.indexOf(x) !== -1; });
      camDetector = new BarcodeDetector({ formats: usar });
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    }).then(function(s) {
      camStream = s;
      var v = document.getElementById('cam-video');
      v.style.display = 'block';
      document.getElementById('cam-lib').style.display = 'none';
      v.srcObject = s;
      return v.play();
    }).then(function() {
      camModo = 'nativo';
      camEscaneando = true;
      requestAnimationFrame(loopNativo);
    }).catch(function(e) {
      usarFallbackLib(e);
    });
  } else {
    usarFallbackLib(null);
  }
}

function loopNativo() {
  if (!camEscaneando || !camDetector) return;
  var v = document.getElementById('cam-video');
  camDetector.detect(v).then(function(cods) {
    if (!camEscaneando) return;
    if (cods && cods.length) onDetectarCamara(cods[0].rawValue);
    else requestAnimationFrame(loopNativo);
  }).catch(function() {
    if (camEscaneando) requestAnimationFrame(loopNativo);
  });
}

function usarFallbackLib(errPrevio) {
  detenerStreamNativo();
  if (typeof Html5Qrcode === 'undefined') {
    toastCam({ ok: false, mensaje: '⚠️ No se pudo abrir la cámara. Revisa el permiso.' });
    return;
  }
  document.getElementById('cam-video').style.display = 'none';
  var cont = document.getElementById('cam-lib');
  cont.style.display = 'block';
  cont.innerHTML = '';

  var fmts = [];
  if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
    fmts = [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.QR_CODE];
  }
  html5QrCode = new Html5Qrcode('cam-lib');
  html5QrCode.start({ facingMode: 'environment' },
    { fps: 15, qrbox: { width: 260, height: 160 }, formatsToSupport: fmts },
    function(decoded) { onDetectarCamara(decoded); },
    function() {
      if (!USUARIO) {

  USUARIO = prompt(
    'Ingrese su correo corporativo'
  );

  if (USUARIO) {

    localStorage.setItem(
      'usuarioPicking',
      USUARIO.trim()
    );

  }
}
  ).then(function() {
    camModo = 'lib';
    camEscaneando = true;
  }).catch(function(err) {
    var msg = '⚠️ No se pudo acceder a la cámara.';
    var s = String(err).toLowerCase();
    if (s.indexOf('notallowed') > -1 || s.indexOf('denied') > -1) {
      msg = '📵 Permiso de cámara denegado. Tócalo en el 🔒 de la barra de URL.';
    }
    toastCam({ ok: false, mensaje: msg });
  });
}

function onDetectarCamara(codigo) {
  if (!camEscaneando) return;
  camEscaneando = false;
  beep();
  if (navigator.vibrate) navigator.vibrate(120);
  if (camModo === 'lib' && html5QrCode) { try { html5QrCode.pause(true); } catch (e) {} }

  camCodigo = codigo;
  document.getElementById('cam-cod').textContent = codigo;
  document.getElementById('cam-cant').value = 1;
  document.getElementById('cam-confirm').classList.add('show');
}

function reanudarScanner() {
  document.getElementById('cam-confirm').classList.remove('show');
  if (camModo === 'lib' && html5QrCode) {
    try { html5QrCode.resume(); } catch (e) {}
    camEscaneando = true;
  } else {
    camEscaneando = true;
    requestAnimationFrame(loopNativo);
  }
}

function confirmarCamara() {
  var cant = parseInt(document.getElementById('cam-cant').value, 10) || 1;
  if (cant < 1) cant = 1;
  var codigo = camCodigo;
  var b = document.getElementById('cam-confirm-btn');
  b.disabled = true; b.textContent = 'Validando...';

  validarCodigo(codigo, cant).then(function(res) {
    b.disabled = false; b.textContent = 'Confirmar';
    toastCam(res);
    if (res && res.ok && res.pedidoCompleto) {
      cerrarCamara();
    } else {
      reanudarScanner();
    }
  });
}

function cerrarCamara() {
  camEscaneando = false;
  detenerStreamNativo();
  if (html5QrCode) {
    try {
      html5QrCode.stop().catch(function() {}).finally(function() {
        try { html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      });
    } catch (e) { html5QrCode = null; }
  }
  document.getElementById('cam-overlay').classList.remove('show');
  document.getElementById('cam-confirm').classList.remove('show');
  ocultarToastCam();
  camModo = null;
}

function detenerStreamNativo() {
  if (camStream) { camStream.getTracks().forEach(function(t) { t.stop(); }); camStream = null; }
  var v = document.getElementById('cam-video');
  if (v) v.srcObject = null;
}

function toastCam(res) {
  var t = document.getElementById('cam-toast');
  t.className = 'cam-toast';
  if (!res) return;
  t.textContent = res.mensaje || (res.ok ? 'OK' : 'Error');
  if (res.ok) t.classList.add('ok');
  else if (res.mensaje && res.mensaje.indexOf('⚠️') > -1) t.classList.add('warn');
  else t.classList.add('error');
  clearTimeout(t._t);
  t._t = setTimeout(ocultarToastCam, 2600);
}
function ocultarToastCam() { document.getElementById('cam-toast').className = 'cam-toast'; }

// ═══════════════════════════════════════════════════════════
//  BIND EVENTOS
// ═══════════════════════════════════════════════════════════
document.getElementById('btn-refresh').addEventListener('click', cargarPedidos);
document.getElementById('btn-volver').addEventListener('click', function() {
  cerrarCamara();
  mostrarPantalla('screen-pedidos');
  cargarPedidos();
});
document.getElementById('btn-camara').addEventListener('click', abrirCamara);
document.getElementById('btn-validar').addEventListener('click', function() { validarCodigo(); });
document.getElementById('btn-nuevo-picking').addEventListener('click', function() {
  mostrarPantalla('screen-pedidos');
  cargarPedidos();
});
document.getElementById('input-codigo').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') validarCodigo();
});
document.getElementById('cant-menos').addEventListener('click', function() {
  var i = document.getElementById('input-cantidad');
  i.value = Math.max(1, parseInt(i.value, 10) - 1);
});
document.getElementById('cant-mas').addEventListener('click', function() {
  var i = document.getElementById('input-cantidad');
  i.value = Math.min(9999, parseInt(i.value, 10) + 1);
});

// Overlay cámara
document.getElementById('cam-cerrar').addEventListener('click', cerrarCamara);
document.getElementById('cam-confirm-btn').addEventListener('click', confirmarCamara);
document.getElementById('cam-otro').addEventListener('click', reanudarScanner);
document.getElementById('cam-menos').addEventListener('click', function() {
  var i = document.getElementById('cam-cant');
  i.value = Math.max(1, (parseInt(i.value, 10) || 1) - 1);
});
document.getElementById('cam-mas').addEventListener('click', function() {
  var i = document.getElementById('cam-cant');
  i.value = (parseInt(i.value, 10) || 1) + 1;
});

// ═══════════════════════════════════════════════════════════
//  INICIO — leer parámetros de la URL
// ═══════════════════════════════════════════════════════════
(function() {
  var params = new URLSearchParams(window.location.search);
  var pedidoId  = params.get('pedido');
  var pedidoDoc = params.get('doc');

  if (pedidoId) {
    mostrarPantalla('screen-picking');
    document.getElementById('pick-doc').textContent = pedidoDoc || pedidoId;
    document.getElementById('pick-cli').textContent = 'Cargando...';
    pedidoActual = pedidoId;

    api({ action: 'detalle', id: pedidoId })
      .then(function(items) {
        itemsActuales = items || [];
        renderItems();
        actualizarProgreso();
        api({ action: 'pedidos' }).then(function(pedidos) {
          var p = (pedidos || []).filter(function(x) { return x.id === pedidoId; })[0];
          if (p) document.getElementById('pick-cli').textContent = p.cliente;
        }).catch(function() {});
      })
      .catch(function(err) {
        document.getElementById('lista-items').innerHTML =
          '<div class="empty"><div class="icon">⚠️</div><div class="titulo">Error</div><div class="sub">' + err.message + '</div></div>';
      });
  } else {
    cargarPedidos();
  }
})();
</script>
